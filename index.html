<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EarthSynth — many ways to listen</title>
  <meta name="description" content="Explore NASA ocean temperature, nitrogen oxides and wind pictures through independently measured sound layers, with an optional cinematic listening room.">
  <meta name="ai-assistance" content="Implementation assisted by OpenAI Codex. NASA imagery is not AI-generated. Audio is synthesized procedurally; the musical backdrop is artistic interpretation.">
  <meta name="theme-color" content="#f2efdf">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,600;1,400&amp;family=Source+Sans+3:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="./proposal.css">
  <link rel="stylesheet" href="./exploration.css">
  <link rel="stylesheet" href="./cinematic.css">
  <style>
    * { box-sizing: border-box; }
    body { background: var(--plane, #f2efdf); color: var(--primary, #203d32); font-family: var(--font, sans-serif); }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    #earth-experience > [role="status"] { padding: 48px 0; }
  </style>
</head>
<body>
  <main id="earth-experience" aria-label="EarthSynth listening experience">
    <p role="status">Loading ocean, air and wind layers…</p>
  </main>
  <noscript>EarthSynth needs JavaScript to generate and measure sound. NASA source pictures and methodology are documented in the project README.</noscript>
  <script type="module" src="./src/explore-app.js"></script>
</body>
</html>
